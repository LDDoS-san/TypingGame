services:
  app:
    build: ./backend
    container_name: typing-game-app
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/typing_game
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: to
      
  db:
    image: postgres:16
    container_name: typing-game-db
    environment:
      POSTGRES_DB: typing_game
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: to
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: